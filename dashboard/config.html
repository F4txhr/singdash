<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Configuration & Settings</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#19e66b",
                        "background-light": "#f6f8f7",
                        "background-dark": "#112117",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: "Space Grotesk", sans-serif;
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-white min-h-screen">
    <div class="relative flex h-full min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden pb-32">
        <!-- TopAppBar -->
        <div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10 border-b border-white/10">
            <div class="text-primary flex size-12 shrink-0 items-center justify-center">
                <span class="material-symbols-outlined text-3xl">settings_suggest</span>
            </div>
            <h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1">Configuration</h2>
            <div class="text-primary flex size-12 shrink-0 items-center justify-end">
                <span class="material-symbols-outlined cursor-pointer" onclick="location.reload()">restart_alt</span>
            </div>
        </div>

        <!-- Dashboard Settings Section -->
        <h3 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-6">Dashboard Settings</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-0">
            <div class="flex flex-wrap items-end gap-4 px-4 py-3">
                <label class="flex flex-col min-w-40 flex-1">
                    <p class="text-gray-700 dark:text-white/70 text-sm font-medium leading-normal pb-2">Theme</p>
                    <div class="relative">
                        <select id="theme-select" class="form-input flex w-full min-w-0 flex-1 appearance-none rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-gray-300 dark:border-[#346548] bg-white dark:bg-[#1a3224] h-14 p-[15px] text-base font-normal leading-normal">
                            <option value="dark">Dark Mode</option>
                            <option value="light">Light Mode</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-primary">
                            <span class="material-symbols-outlined">expand_more</span>
                        </div>
                    </div>
                </label>
            </div>
            <div class="flex flex-wrap items-end gap-4 px-4 py-3">
                <label class="flex flex-col min-w-40 flex-1">
                    <p class="text-gray-700 dark:text-white/70 text-sm font-medium leading-normal pb-2">Refresh Interval</p>
                    <div class="relative">
                        <select id="refresh-interval" class="form-input flex w-full min-w-0 flex-1 appearance-none rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-gray-300 dark:border-[#346548] bg-white dark:bg-[#1a3224] h-14 p-[15px] text-base font-normal leading-normal">
                            <option value="1000">1 second</option>
                            <option value="2000">2 seconds</option>
                            <option value="5000">5 seconds</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-primary">
                            <span class="material-symbols-outlined">expand_more</span>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <!-- Backend Connection Section -->
        <h3 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-6">Backend Connection</h3>
        <div class="flex flex-col gap-1">
            <div class="flex flex-wrap items-end gap-4 px-4 py-3">
                <label class="flex flex-col min-w-40 flex-1">
                    <p class="text-gray-700 dark:text-white/70 text-sm font-medium leading-normal pb-2">Base URL (External Controller)</p>
                    <input id="base-url" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-gray-300 dark:border-[#346548] bg-white dark:bg-[#1a3224] h-14 placeholder:text-gray-400 dark:placeholder:text-[#93c8a8] p-[15px] text-base font-normal leading-normal" value="http://127.0.0.1:9090"/>
                </label>
            </div>
            <div class="flex flex-wrap items-end gap-4 px-4 py-3">
                <label class="flex flex-col min-w-40 flex-1">
                    <p class="text-gray-700 dark:text-white/70 text-sm font-medium leading-normal pb-2">Secret (Optional)</p>
                    <div class="relative">
                        <input id="api-secret" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-gray-300 dark:border-[#346548] bg-white dark:bg-[#1a3224] h-14 placeholder:text-gray-400 dark:placeholder:text-[#93c8a8] p-[15px] pr-12 text-base font-normal leading-normal" type="password" value=""/>
                        <div class="absolute inset-y-0 right-0 flex items-center px-4 text-primary">
                            <span id="toggle-secret" class="material-symbols-outlined cursor-pointer">visibility</span>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <!-- Sticky Save Button -->
        <div class="fixed bottom-20 left-0 right-0 px-4 py-4 bg-gradient-to-t from-background-light dark:from-background-dark via-background-light/90 dark:via-background-dark/90 to-transparent z-10">
            <button id="save-btn" class="w-full bg-primary text-background-dark font-bold py-4 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">save</span>
                Save Changes
            </button>
        </div>

        <!-- Navigation Bar -->
        <div class="fixed bottom-0 left-0 right-0 h-20 bg-background-light dark:bg-background-dark border-t border-white/10 flex items-center justify-around px-6 z-20">
            <a href="overview.html" class="flex flex-col items-center gap-1 text-gray-500">
                <span class="material-symbols-outlined">dashboard</span>
                <span class="text-[10px] font-medium">Overview</span>
            </a>
            <a href="proxies.html" class="flex flex-col items-center gap-1 text-gray-500">
                <span class="material-symbols-outlined">swap_calls</span>
                <span class="text-[10px] font-medium">Proxies</span>
            </a>
            <a href="logs.html" class="flex flex-col items-center gap-1 text-gray-500">
                <span class="material-symbols-outlined">analytics</span>
                <span class="text-[10px] font-medium">Logs</span>
            </a>
            <a href="config.html" class="flex flex-col items-center gap-1 text-primary">
                <span class="material-symbols-outlined">settings</span>
                <span class="text-[10px] font-medium">Config</span>
            </a>
        </div>
    </div>

    <script type="module">
        import { Settings } from './js/utils.js';

        const themeSelect = document.getElementById('theme-select');
        const refreshInterval = document.getElementById('refresh-interval');
        const baseUrlInput = document.getElementById('base-url');
        const secretInput = document.getElementById('api-secret');
        const saveBtn = document.getElementById('save-btn');
        const toggleSecret = document.getElementById('toggle-secret');

        // Load current settings
        const current = Settings.get();
        themeSelect.value = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        refreshInterval.value = current.refreshInterval;
        baseUrlInput.value = current.baseUrl;
        secretInput.value = current.secret;

        saveBtn.addEventListener('click', () => {
            const newSettings = {
                baseUrl: baseUrlInput.value,
                secret: secretInput.value,
                refreshInterval: parseInt(refreshInterval.value)
            };
            Settings.save(newSettings);

            // Apply theme immediately
            if (themeSelect.value === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            alert('Settings saved successfully!');
        });

        toggleSecret.addEventListener('click', () => {
            if (secretInput.type === 'password') {
                secretInput.type = 'text';
                toggleSecret.innerText = 'visibility_off';
            } else {
                secretInput.type = 'password';
                toggleSecret.innerText = 'visibility';
            }
        });
    </script>
</body>
</html>
