<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SingDash</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <h1>SingDash</h1>
      <nav>
        <button class="nav-item active" data-section="overview">Overview</button>
        <button class="nav-item" data-section="proxies">Proxies</button>
        <button class="nav-item" data-section="rules">Rules</button>
        <button class="nav-item" data-section="logs">Logs</button>
      </nav>
      <div class="status-pill">Core: <strong id="coreStatus">Connecting...</strong></div>
    </aside>

    <main class="content">
      <header>
        <h2 id="sectionTitle">Overview</h2>
        <button id="toggleCore" class="primary">Test Connection</button>
      </header>

      <section id="overview" class="section active">
        <article class="panel control-panel">
          <h3>Sing-box Controller</h3>
          <div class="control-grid">
            <label>
              Base URL
              <input id="controllerUrl" type="text" placeholder="http://127.0.0.1:9090" />
            </label>
            <label>
              Secret (opsional)
              <input id="controllerSecret" type="password" placeholder="Bearer token" />
            </label>
            <button id="saveConfig" class="primary">Simpan & Connect</button>
          </div>
          <p class="hint">Contoh: <code>http://127.0.0.1:9090</code> (pastikan endpoint Clash API aktif).</p>
        </article>

        <div class="cards">
          <article class="card">
            <h3>Download</h3>
            <p id="downloadRate">0 KB/s</p>
          </article>
          <article class="card">
            <h3>Upload</h3>
            <p id="uploadRate">0 KB/s</p>
          </article>
          <article class="card">
            <h3>Active Proxy</h3>
            <p id="activeProxy">-</p>
          </article>
          <article class="card">
            <h3>Connections</h3>
            <p id="connections">0</p>
          </article>
          <article class="card">
            <h3>Mode</h3>
            <p id="dashboardMode">Waiting API</p>
          </article>
        </div>
        <article class="panel">
          <h3>Traffic Monitor</h3>
          <canvas id="trafficChart" width="800" height="220" aria-label="Traffic chart"></canvas>
        </article>
      </section>

      <section id="proxies" class="section">
        <article class="panel">
          <h3>Proxy Groups</h3>
          <ul id="proxyList" class="proxy-list"></ul>
        </article>
      </section>

      <section id="rules" class="section">
        <article class="panel">
          <h3>Routing Rules</h3>
          <ul class="rules-list" id="rulesList"></ul>
        </article>
      </section>

      <section id="logs" class="section">
        <article class="panel">
          <h3>Real-time Logs</h3>
          <pre id="logOutput"></pre>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
