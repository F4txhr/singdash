<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Singdash VPN Dashboard (React)</title>
  <style>
    :root {
      --bg: #f4f7ff;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app { max-width: 1240px; margin: 0 auto; padding: 24px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .06);
    }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px; margin-bottom: 16px; }
    .title h1 { margin: 0; font-size: 24px; }
    .title p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-primary { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-muted { background: #334155; }
    .btn-danger { background: var(--danger); }
    .grid { display: grid; gap: 12px; }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .stat { padding: 14px; }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { font-size: 26px; font-weight: 800; margin-top: 6px; }
    .toolbar, .panel { padding: 16px; margin-top: 14px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    .toolbar input { max-width: 360px; }
    .proxy-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); margin-top: 14px; }
    .proxy-item { padding: 14px; }
    .proxy-top { display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px; }
    .badge { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .alive { color: #166534; background: #dcfce7; }
    .slow { color: #854d0e; background: #fef9c3; }
    .dead { color: #991b1b; background: #fee2e2; }
    .untested { color: #334155; background: #e2e8f0; }
    .proxy-actions { display: flex; gap: 8px; margin-top: 10px; }
    .proxy-actions button { flex: 1; }
    .message { margin: 12px 0; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
    .message.success { background: #dcfce7; color: #166534; }
    .message.error { background: #fee2e2; color: #991b1b; }
    .message.warning { background: #fef9c3; color: #854d0e; }
    .modal {
      position: fixed; inset: 0; background: rgba(15, 23, 42, .5);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-content { width: min(560px, 100%); padding: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .muted { color: var(--muted); font-size: 12px; }
    @media (max-width: 720px) {
      .form-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: start; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const statusClass = (status) => ({
      alive: 'alive',
      slow: 'slow',
      dead: 'dead',
      untested: 'untested'
    }[status || 'untested']);

    const getFlag = (cc = 'XX') => {
      if (!cc || cc.length !== 2) return '🌍';
      return String.fromCodePoint(...cc.toUpperCase().split('').map(c => 127397 + c.charCodeAt()));
    };

    function App() {
      const [config, setConfig] = useState({
        supabaseUrl: localStorage.getItem('supabaseUrl') || '',
        supabaseKey: localStorage.getItem('supabaseKey') || '',
        apiUrl: localStorage.getItem('apiUrl') || 'http://localhost:3001'
      });
      const [showSettings, setShowSettings] = useState(!localStorage.getItem('supabaseUrl') || !localStorage.getItem('supabaseKey'));
      const [message, setMessage] = useState(null);
      const [loading, setLoading] = useState({ fetch: false, test: false });
      const [proxies, setProxies] = useState([]);
      const [search, setSearch] = useState('');
      const [filterStatus, setFilterStatus] = useState('');
      const [githubUrl, setGithubUrl] = useState('https://raw.githubusercontent.com/FoolVPN-ID/Nautica/main/proxyList.txt');
      const [lastSync, setLastSync] = useState(null);

      const notify = (text, type = 'warning') => {
        setMessage({ text, type });
        setTimeout(() => setMessage(null), 4500);
      };

      const supabaseQuery = async (table, options = {}) => {
        const { method = 'GET', body = null, select = '*', filter = null } = options;
        let url = `${config.supabaseUrl}/rest/v1/${table}?select=${select}`;
        if (filter) url += `&${filter}`;

        const res = await fetch(url, {
          method,
          headers: {
            apikey: config.supabaseKey,
            Authorization: `Bearer ${config.supabaseKey}`,
            'Content-Type': 'application/json',
            Prefer: method === 'POST' || method === 'PATCH' ? 'return=representation' : ''
          },
          body: body ? JSON.stringify(body) : null
        });

        if (!res.ok) {
          const errTxt = await res.text();
          throw new Error(`Supabase ${res.status}: ${errTxt}`);
        }
        return res.json();
      };

      const apiCall = async (endpoint, options = {}) => {
        const res = await fetch(`${config.apiUrl}${endpoint}`, {
          method: options.method || 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: options.body ? JSON.stringify(options.body) : null
        });
        if (!res.ok) throw new Error(`API ${res.status}`);
        return res.json();
      };

      const loadProxies = async () => {
        if (!config.supabaseUrl || !config.supabaseKey) return;
        try {
          const data = await supabaseQuery('proxy_cache', { select: '*', filter: 'order=created_at.desc&limit=500' });
          setProxies(data || []);
          setLastSync(new Date().toISOString());
        } catch (err) {
          notify(`Gagal load proxies: ${err.message}`, 'error');
        }
      };

      useEffect(() => {
        loadProxies();
      }, [config.supabaseUrl, config.supabaseKey]);

      const stats = useMemo(() => ({
        total: proxies.length,
        alive: proxies.filter(p => p.status === 'alive').length,
        slow: proxies.filter(p => p.status === 'slow').length,
        dead: proxies.filter(p => p.status === 'dead').length
      }), [proxies]);

      const filteredProxies = useMemo(() => proxies.filter((p) => {
        const q = search.toLowerCase();
        const searchMatch = !q || p.ip?.toLowerCase().includes(q) || (p.country_code || '').toLowerCase().includes(q) || (p.provider || '').toLowerCase().includes(q);
        const statusMatch = !filterStatus || (p.status || 'untested') === filterStatus;
        return searchMatch && statusMatch;
      }), [proxies, search, filterStatus]);

      const parseProxyList = (text) => {
        return text.split('\n')
          .map(line => line.trim())
          .filter(line => line && !line.startsWith('#'))
          .map((line) => {
            if (line.includes(',')) {
              const [ip, port, country = 'XX', provider = 'Unknown'] = line.split(',').map((v) => v.trim());
              return { ip, port: parseInt(port, 10), country_code: country.toUpperCase(), provider };
            }
            if (line.includes(':')) {
              const [ip, port] = line.split(':').map((v) => v.trim());
              return { ip, port: parseInt(port, 10), country_code: 'XX', provider: 'Unknown' };
            }
            return null;
          })
          .filter(Boolean)
          .filter(item => item.ip && Number.isFinite(item.port));
      };

      const handleFetchProxies = async () => {
        if (!config.supabaseUrl || !config.supabaseKey) return notify('Isi settings Supabase dulu', 'warning');
        setLoading(s => ({ ...s, fetch: true }));
        try {
          const res = await fetch(githubUrl);
          if (!res.ok) throw new Error('Source URL tidak bisa diambil');
          const text = await res.text();
          const parsed = parseProxyList(text);
          if (!parsed.length) throw new Error('Tidak ada proxy valid di source');

          await supabaseQuery('proxy_cache', {
            method: 'POST',
            body: parsed.map(p => ({ ...p, status: 'untested', last_tested_at: null }))
          });

          notify(`Berhasil import ${parsed.length} proxy`, 'success');
          await loadProxies();
        } catch (err) {
          notify(err.message, 'error');
        } finally {
          setLoading(s => ({ ...s, fetch: false }));
        }
      };

      const handleTestAll = async () => {
        if (!proxies.length) return notify('Belum ada proxy untuk dites', 'warning');
        setLoading(s => ({ ...s, test: true }));
        try {
          notify('Testing proxies berjalan...', 'warning');
          await apiCall('/api/v1/proxies/test-batch', { body: { proxies } });
          notify('Testing selesai. Refresh data...', 'success');
          await loadProxies();
        } catch (err) {
          notify(`Testing gagal: ${err.message}`, 'error');
        } finally {
          setLoading(s => ({ ...s, test: false }));
        }
      };

      const saveSettings = (evt) => {
        evt.preventDefault();
        localStorage.setItem('supabaseUrl', config.supabaseUrl.replace(/\/$/, ''));
        localStorage.setItem('supabaseKey', config.supabaseKey);
        localStorage.setItem('apiUrl', config.apiUrl.replace(/\/$/, ''));
        setConfig(c => ({
          ...c,
          supabaseUrl: c.supabaseUrl.replace(/\/$/, ''),
          apiUrl: c.apiUrl.replace(/\/$/, '')
        }));
        setShowSettings(false);
        notify('Settings tersimpan', 'success');
      };

      return (
        <div className="app">
          <div className="card header">
            <div className="title">
              <h1>🌐 Singdash VPN Dashboard (React)</h1>
              <p>Versi modern dengan React state management untuk operasional harian.</p>
            </div>
            <div className="actions">
              <button className="btn btn-muted" onClick={() => setShowSettings(true)}>⚙️ Settings</button>
              <button className="btn btn-success" onClick={handleFetchProxies} disabled={loading.fetch}>{loading.fetch ? 'Importing...' : '📥 Fetch'}</button>
              <button className="btn btn-primary" onClick={handleTestAll} disabled={loading.test}>{loading.test ? 'Testing...' : '🔄 Test All'}</button>
            </div>
          </div>

          {message && <div className={`message ${message.type}`}>{message.text}</div>}

          <div className="grid grid-4">
            <div className="card stat"><div className="label">Total Proxies</div><div className="value">{stats.total}</div></div>
            <div className="card stat"><div className="label">Alive</div><div className="value" style={{ color: '#16a34a' }}>{stats.alive}</div></div>
            <div className="card stat"><div className="label">Slow</div><div className="value" style={{ color: '#d97706' }}>{stats.slow}</div></div>
            <div className="card stat"><div className="label">Dead</div><div className="value" style={{ color: '#dc2626' }}>{stats.dead}</div></div>
          </div>

          <div className="card panel">
            <div className="muted">API: {config.apiUrl || '-'} • Last sync: {lastSync ? new Date(lastSync).toLocaleString() : 'Belum sync'}</div>
            <div className="toolbar">
              <input placeholder="Cari IP / country / provider" value={search} onChange={(e) => setSearch(e.target.value)} />
              <div style={{ display: 'flex', gap: 8 }}>
                <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
                  <option value="">All status</option>
                  <option value="alive">Alive</option>
                  <option value="slow">Slow</option>
                  <option value="dead">Dead</option>
                  <option value="untested">Untested</option>
                </select>
                <input value={githubUrl} onChange={(e) => setGithubUrl(e.target.value)} title="GitHub Raw URL" />
              </div>
            </div>

            {!filteredProxies.length ? (
              <div className="muted" style={{ marginTop: 12 }}>Belum ada data proxy. Klik tombol Fetch untuk import.</div>
            ) : (
              <div className="proxy-grid">
                {filteredProxies.map((p, idx) => (
                  <div key={`${p.ip}-${p.port}-${idx}`} className="card proxy-item">
                    <div className="proxy-top">
                      <div>
                        <div style={{ fontWeight: 700 }}>{getFlag(p.country_code)} {p.country_code || 'XX'}</div>
                        <div className="muted">{p.provider || 'Unknown provider'}</div>
                      </div>
                      <span className={`badge ${statusClass(p.status)}`}>{p.status || 'untested'}</span>
                    </div>
                    <div><code>{p.ip}:{p.port}</code></div>
                    {p.response_time_ms ? <div className="muted">Ping: {p.response_time_ms} ms</div> : null}
                    <div className="proxy-actions">
                      <button className="btn btn-muted" onClick={() => notify('Gunakan endpoint API untuk test single (next iteration)', 'warning')}>Test</button>
                      <button className="btn btn-primary" onClick={() => notify('Generate config akan dihubungkan ke endpoint config', 'warning')}>Config</button>
                      <button className="btn btn-danger" onClick={() => notify('Delete proxy via Supabase akan ditambahkan di iterasi berikutnya', 'warning')}>Delete</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {showSettings && (
            <div className="modal" onClick={() => setShowSettings(false)}>
              <div className="card modal-content" onClick={(e) => e.stopPropagation()}>
                <h3 style={{ marginTop: 0 }}>⚙️ Settings</h3>
                <form onSubmit={saveSettings}>
                  <div className="form-grid">
                    <div>
                      <label>Supabase URL</label>
                      <input value={config.supabaseUrl} onChange={(e) => setConfig(c => ({ ...c, supabaseUrl: e.target.value }))} required />
                    </div>
                    <div>
                      <label>Supabase Key</label>
                      <input value={config.supabaseKey} onChange={(e) => setConfig(c => ({ ...c, supabaseKey: e.target.value }))} required />
                    </div>
                  </div>
                  <div style={{ marginTop: 10 }}>
                    <label>Testing API URL</label>
                    <input value={config.apiUrl} onChange={(e) => setConfig(c => ({ ...c, apiUrl: e.target.value }))} />
                  </div>
                  <div style={{ marginTop: 14, display: 'flex', justifyContent: 'end', gap: 8 }}>
                    <button type="button" className="btn btn-muted" onClick={() => setShowSettings(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Save</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
